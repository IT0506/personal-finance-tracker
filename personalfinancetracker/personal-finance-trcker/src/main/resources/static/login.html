<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Personal Finance Tracker</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="container" style="max-width: 400px;">
    <h2>Login</h2>

    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />

    <button type="button" onclick="loginUser()">Login</button>

    <div class="link">
        <a href="/register.html">Create Account</a>
    </div>
</div>

<script>
async function loginUser() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
        alert("Please enter email and password.");
        return;
    }

    try {
        // Use your deployed Render backend URL
        const response = await fetch(
            "https://personal-finance-tracker-tvew.onrender.com/auth/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        // Parse response body safely
        const result = await response.text();

        if (response.ok) {
            const data = JSON.parse(result);

            // Save token and userId in localStorage
            localStorage.setItem("token", data.token);
            localStorage.setItem("userId", data.userId);

            alert("Login successful!");

            // Redirect to dashboard on Vercel
            window.location.href =
                "https://personal-finance-tracker-lac-eight.vercel.app/dashboard.html";
        } else {
            alert("Login failed: " + result);
        }

    } catch (error) {
        console.error("Login error:", error);
        alert("Unable to connect to server.");
    }
}

// Allow Enter key to trigger login
document.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        loginUser();
    }
});
</script>

</body>
</html>
