<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Personal Finance Tracker</title>

    <link rel="stylesheet" href="/css/style.css" />

    <!-- Redirect to login if token is missing -->
    <script>
        if (!localStorage.getItem("token")) {
            window.location.href = "/index.html";
        }
    </script>
</head>
<body>

    <div class="container">
        <h1>Personal Finance Dashboard</h1>

        <!-- Logout -->
        <button class="secondary" onclick="logout()">Logout</button>

        <!-- =========================
             Summary Cards
        ========================== -->
        <div class="card-grid">
            <div class="card income">
                <h3>Total Income</h3>
                <p id="totalIncome">0</p>
            </div>

            <div class="card expense">
                <h3>Total Expense</h3>
                <p id="totalExpense">0</p>
            </div>

            <div class="card balance">
                <h3>Balance</h3>
                <p id="balance">0</p>
            </div>
        </div>

        <!-- =========================
             Add Transaction Form
        ========================== -->
        <h2>Add Transaction</h2>

        <div class="form-grid">
            <select id="type">
                <option value="INCOME">INCOME</option>
                <option value="EXPENSE">EXPENSE</option>
            </select>

            <input
                type="number"
                id="amount"
                placeholder="Amount"
                step="0.01"
            />

            <input
                type="text"
                id="category"
                placeholder="Category"
            />

            <input
                type="text"
                id="description"
                placeholder="Description"
            />

            <input
                type="date"
                id="txnDate"
            />
        </div>

        <button onclick="addTransaction()">
            Add Transaction
        </button>

        <!-- =========================
             Export Section
        ========================== -->
        <h2>Export Reports</h2>

        <div class="form-grid">
            <button onclick="exportCSV()">
                Export CSV
            </button>

            <button onclick="exportPDF()">
                Export PDF
            </button>
        </div>

        <!-- =========================
             Goal Tracking Section
        ========================== -->
        <h2>Financial Goal Tracker</h2>

        <div class="form-grid">
            <input
                type="text"
                id="goalName"
                placeholder="Goal Name (e.g. Buy Laptop)"
            />

            <input
                type="number"
                id="goalAmount"
                placeholder="Target Amount"
                step="0.01"
            />
        </div>

        <button onclick="saveGoal()">Save Goal</button>
        <div class="card balance" style="margin-top: 15px;">
            <h3>Current Goal</h3>
            <p id="goalDisplay">No goal set</p>
            <p id="goalProgress"></p>
        </div>

        <!-- =========================
             AI Insights Section
        ========================== -->
        <h2>AI Financial Insights</h2>

        <button onclick="getAIInsights()">
            Get AI Insights
        </button>

        <div
            id="aiInsights"
            class="card"
            style="margin-top: 15px; white-space: pre-line;"
        >
            Your AI-generated financial insights will appear here.
        </div>

        <!-- =========================
             Transaction History
        ========================== -->
        <h2>Transactions</h2>

        <table class="table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="transactionTable"></tbody>
        </table>
    </div>

    <!-- =========================
         JavaScript Files
    ========================== -->
    <script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/goal.js"></script>
<script src="/js/ai.js"></script>

</body>
</html>
