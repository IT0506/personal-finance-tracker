<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Personal Finance Tracker</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="container" style="max-width: 400px;">
    <h2>Create Account</h2>

    <input
        type="text"
        id="name"
        placeholder="Full Name"
        required
    />

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    />

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    />

    <button type="button" onclick="registerUser()">
        Register
    </button>

    <div class="link">
        <a href="/index.html">Back to Login</a>
    </div>
</div>

<script>
async function registerUser() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    // Validation
    if (!name || !email || !password) {
        alert("Please fill all fields.");
        return;
    }

    try {
        // Call Render backend directly
        const response = await fetch(
            "https://personal-finance-tracker-tvew.onrender.com/auth/register",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password
                })
            }
        );

        const result = await response.text();

        if (response.ok) {
            alert("Registration successful!");

            // Redirect to login page on Vercel
            window.location.href =
                "https://personal-finance-tracker-lac-eight.vercel.app/index.html";
        } else {
            alert("Registration failed: " + result);
        }

    } catch (error) {
        console.error("Registration error:", error);
        alert("Unable to connect to server.");
    }
}

// Press Enter to register
document.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        registerUser();
    }
});
</script>

</body>
</html>
