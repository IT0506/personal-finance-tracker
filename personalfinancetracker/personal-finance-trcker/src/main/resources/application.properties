 # ==========================================
# Application Name
# ==========================================
spring.application.name=personal-finance-tracker

# ==========================================
# Server Port
# Render sets PORT automatically in production.
# Locally, app runs on 8080 by default.
# ==========================================
server.port=${PORT:8080}

# ==========================================
# PostgreSQL Database Configuration
# These values come from Render environment variables.
# ==========================================
spring.datasource.url=postgresql://finance_user:O0VlSTtWNQHNSp4X8kqSORRDb0CIClBd@dpg-d84vo8p9rddc739urt5g-a.singapore-postgres.render.com/finance_db_rav6
spring.datasource.username=finance_user
spring.datasource.password=O0VlSTtWNQHNSp4X8kqSORRDb0CIClBd
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect (optional with Spring Boot, but safe to keep)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Static Resources
# ==========================================
spring.web.resources.static-locations=classpath:/static/

# ==========================================
# JWT Secret
# Set this in Render environment variables.
# ==========================================
jwt.secret=ThisIsMyVerySecureSecretKeyForJWT123456
jwt.expiration=86400000

# ==========================================
# Logging (optional)
# ==========================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
