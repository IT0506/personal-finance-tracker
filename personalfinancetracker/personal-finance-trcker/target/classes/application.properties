# ==========================================
# Application Configuration
# ==========================================
spring.application.name=personal-finance-trcker

# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# Oracle Database Configuration
# Update username and password as needed
# ==========================================
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/orcl
spring.datasource.username=system
spring.datasource.password=newpassword
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ==========================================
# Static Resources
# ==========================================
spring.web.resources.static-locations=classpath:/static/
server.error.whitelabel.enabled=false
# ==========================================
# Logging
# ==========================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ==========================================
# JWT Configuration
# Must be at least 32 characters for HS256
# ==========================================
jwt.secret=ThisIsMyVerySecureSecretKeyForJWT123456
jwt.expiration=86400000

openai.api.key=YOUR_OPENAI_API_KEY
openai.model=gpt-4.1-mini

# ==========================================
# Optional: Enable all actuator endpoints
# (Only if actuator dependency is added)
# ==========================================
# management.endpoints.web.exposure.include=*

# ==========================================
# Optional: Disable default Spring Security user
# (Not necessary when using SecurityConfig)
# ==========================================
 #spring.security.user.name=admin
 #spring.security.user.password=admin